name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
# allow manual runs on branches without a PR

env:
  FORCE_COLOR: "1"

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: "Set up Python"
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - name: Install nox
        run: uv tool install nox

      - name: Run linter
        run: nox -s lint

  tests:
    name: Unit test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: "Set up Python"
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - name: Install nox
        run: uv tool install nox

      - name: Run tests
        run: nox -s tests

  validate_build:
    name: Build artifacts
    needs: [lint, tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: snapcore/action-build@v1
        name: Build snap
      - uses: "DeterminateSystems/nix-installer-action@main"
      - run: nix build
        name: Build Flake
